[package]
name = "lebos-ref"
version = "0.1.0"
edition = "2021"

# The reference kernel -- the one written alongside Claude across milestones
# 1-20. It still boots, and it exists to be READ while the real one is written.
# Same role xv6 plays for everyone else, except every decision in it is already
# Sebastian's and the comments explain the reasoning.
[[bin]]
name = "lebos-ref"
path = "reference/main.rs"
test = false
bench = false

# Scratch copy for experiments. Gitignored, and built only by `make play` so
# that breaking it can never block `make run`. Create/refresh it from main.rs
# with `make resync`.
[[bin]]
name = "main2"
path = "reference/main2.rs"
test = false
bench = false

# Kernels must abort, never unwind: there is no runtime to unwind into.
[profile.dev]
panic = "abort"
opt-level = 1     # opt-level = 0 generates enormous stack frames that can
                  # overflow our small boot stack before paging is set up.

[profile.release]
panic = "abort"
lto = true

[dependencies]
