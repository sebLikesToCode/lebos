# LeBOS -- the kernel, written by Sebastian LeBlanc.
#
# The previous kernel lives in reference/ as its own standalone crate. It still
# boots (`make ref`) and exists to be read while this one is written.
[package]
name = "lebos"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "lebos"
path = "src/main.rs"
test = false
bench = false

# There is no unwinder, so a panic must abort.
[profile.dev]
panic = "abort"
# opt-level 0 generates stack frames large enough to overflow a small boot
# stack. 1 is the floor for a kernel.
opt-level = 1

[profile.release]
panic = "abort"
lto = true

[dependencies]
