# ONLY the target lives here.
#
# Cargo MERGES config files up the directory tree, so any rustflags written
# here would be combined with the ROOT crate's -Tkernel.ld -- which links a
# completely different kernel. The Makefile sets RUSTFLAGS in the environment
# instead, which REPLACES config rustflags rather than merging with them.
#
# This is the same trap user/ hit at milestone 10.
[build]
target = "riscv64gc-unknown-none-elf"
