# Applies to any `cargo build` run in this directory. Without it you would
# accidentally build a Linux binary for your own laptop.
[build]
target = "riscv64gc-unknown-none-elf"

[target.riscv64gc-unknown-none-elf]
rustflags = [
    # PC-relative addressing everywhere (auipc, never lui). rustc calls this
    # "medium"; LLVM and the RISC-V world call the same thing "medany".
    "-C", "code-model=medium",
    # Use our linker script rather than the default. This is what decides the
    # kernel lives at 0x8020_0000 -- see kernel.ld.
    "-C", "link-arg=-Tkernel.ld",
    # Do not let the linker garbage-collect boot code just because nothing
    # appears to call it.
    "-C", "link-arg=--no-gc-sections",
]

# `cargo run` boots it. The Makefile has the same command plus debug variants.
runner = """
qemu-system-riscv64
    -machine virt
    -cpu rv64
    -smp 1
    -m 128M
    -nographic
    -serial mon:stdio
    -bios default
    -kernel
"""
