# A standalone crate, deliberately NOT part of the kernel's workspace.
#
# It cannot share the kernel's build: the kernel is linked into the high half
# with code-model=medium, while a user program must live in the LOW half -- the
# 256 GB the kernel gave up when it relocated and dropped the identity map.
#
# Separate crate, separate linker script, separate everything.
[workspace]

[package]
name = "hello"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "hello"
path = "src/main.rs"
test = false
bench = false

[profile.dev]
panic = "abort"
opt-level = 1

[profile.release]
panic = "abort"
